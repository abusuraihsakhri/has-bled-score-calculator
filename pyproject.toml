[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "has-bled-score-calculator"
version = "1.0.0"
description = "HAS-BLED Score Calculator for Major Bleeding Risk in Atrial Fibrillation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dr. Abu Suraih"},
]
keywords = ["has-bled", "cardiology", "atrial-fibrillation", "bleeding-risk", "clinical-score"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
has-bled = "cli:main"

[project.urls]
Repository = "https://github.com/abusuraihsakhri/has-bled-score-calculator"

[tool.setuptools]
py-modules = ["has_bled", "cli"]
